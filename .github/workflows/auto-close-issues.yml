name: Auto-Close Issues

on:
  issues:
    types: [labeled]

jobs:
  close-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    if: github.event.label.name == 'wontfix' || github.event.label.name == 'completed'
    steps:
      - name: Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });
            console.log(`Issue #${context.issue.number} closed automatically due to label: ${context.payload.label.name}`);